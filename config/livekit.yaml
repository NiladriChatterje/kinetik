# Kinetik - LiveKit Server Configuration (Development)
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Docker LAN dev: the container advertises its internal bridge IP, which
  # phones can't reach. Set LIVEKIT_RTC_NODE_IP=<host LAN IP> on the container
  # to force the advertised IP (requires use_external_ip: false, as here).
  use_external_ip: false
  allow_tcp_fallback: true

keys:
  kinetik_livekit_key: kinetik_livekit_secret_2024_dev_xyz

logging:
  level: info
  json: false
  pion_level: error

# ─── TURN (secure relay through strict NATs / corporate firewalls) ──────
# LiveKit embeds a TURN server, but it requires a REAL TLS certificate
# (signed by a trusted CA — self-signed won't work) for a domain that
# resolves to this host, and `domain` must match that certificate. That's
# why TURN is off for LAN dev (no certs).
#
# To enable in production (self-hosted VPS), set these env vars on the
# livekit container — they override this file, and docker-compose already
# wires them through and mounts ./config/certs into /etc/livekit/certs:
#   LIVEKIT_TURN_ENABLED=true
#   LIVEKIT_TURN_DOMAIN=turn.yourdomain.com
#   LIVEKIT_TURN_CERT_FILE=/etc/livekit/certs/turn.crt
#   LIVEKIT_TURN_KEY_FILE=/etc/livekit/certs/turn.key
#   LIVEKIT_TURN_TLS_PORT=5349   # use 443 when there's no load balancer in front
#   LIVEKIT_TURN_UDP_PORT=3478
#   LIVEKIT_TURN_TCP_PORT=3478
#
# Or uncomment the block below instead of using env vars:
# turn:
#   enabled: true
#   domain: turn.yourdomain.com
#   cert_file: /etc/livekit/certs/turn.crt
#   key_file: /etc/livekit/certs/turn.key
#   tls_port: 5349
#   udp_port: 3478
#   tcp_port: 3478
turn:
  enabled: false
  domain: localhost
  udp_port: 3478
  tls_port: 5349


# Redis is only needed for multi-node LiveKit. The local redis container was
# retired (app services use cloud Redis now), and single-node runs without it.
# redis:
#   address: redis:6379
#   password: kinetik_redis_2024
