[project]
name = "kinetik-pose-service"
version = "0.2.0"
description = "Kinetik face service — KYC document face matching (MediaPipe)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "mediapipe==0.10.9",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "PyMuPDF>=1.24.0",    # PDF to image extraction for KYC document face matching
]

[build-system]
requires = ["setuptools>=74.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
