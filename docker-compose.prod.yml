# Production overlay: HTTPS termination in nginx.
# On the server, .env sets  COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# so every plain `docker compose` command picks this up. The certificate is
# issued by certbot on the host (ORACLE_STEPS.md Part 8) and mounted read-only;
# the same-path nginx.conf mount replaces the one in docker-compose.yml.
services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./config/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # ─── Play Billing service-account key ─────────────────────
  # The JSON key lives outside git at ./secrets/ on the server (gitignored)
  # and is mounted read-only; .env points GOOGLE_PLAY_SERVICE_ACCOUNT_FILE at
  # the in-container path. The key is what lets api-core verify, acknowledge
  # and cancel subscriptions against the Play Developer API.
  api-core:
    volumes:
      - ./secrets/play-service-account.json:/run/secrets/play-service-account.json:ro

  # ─── DuckDNS keep-alive ────────────────────────────────────
  # Re-points kinetik-dating.duckdns.org at this server's current public IP
  # every 6 hours (ip= empty means "use the caller's address"). Also keeps the
  # free subdomain from being expired for inactivity. Needs DUCKDNS_TOKEN in
  # .env (DuckDNS dashboard → token); with no token it logs KO and does nothing.
  duckdns:
    image: curlimages/curl:8.11.1
    container_name: kinetik-duckdns
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:-kinetik-dating}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          r=$$(curl -s --max-time 30 "https://www.duckdns.org/update?domains=$${DUCKDNS_DOMAIN}&token=$${DUCKDNS_TOKEN}&ip=")
          echo "$$(date -u +%FT%TZ) duckdns update for $${DUCKDNS_DOMAIN}: $${r:-no response}"
          sleep 21600
        done
