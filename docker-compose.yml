x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kinetik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinetik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetik_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-kinetik}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinetik} -d ${POSTGRES_DB:-kinetik}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Database Migration Runner (one-shot) ────────────────
  # Applies all pending migration SQL files against PostgreSQL
  # on every stack start. Idempotent — safe to run repeatedly.
  migration-runner:
    image: postgres:16-alpine
    container_name: kinetik-migration-runner
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-kinetik}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kinetik_dev_2024}
      DB_NAME: ${POSTGRES_DB:-kinetik}
      MIGRATIONS_DIR: /app/scripts/migrations
    volumes:
      - ./scripts:/app/scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        exec /app/scripts/run-migrations.sh
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # ─── Redis (Caching + Socket.IO adapter + presence) ─────
  redis:
    image: redis:7-alpine
    container_name: kinetik-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-kinetik_redis_2024} --maxmemory 384mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Event Bus Redis (dedicated pub/sub — replaces Kafka) ─
  redis-events:
    image: redis:7-alpine
    container_name: kinetik-redis-events
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_EVENTS_PASSWORD:-kinetik_events_2024} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "${REDIS_EVENTS_PORT:-6380}:6379"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── LiveKit WebRTC SFU ──────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: kinetik-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"       # signaling (WS/WSS)
      - "7881:7881"       # ICE/TCP fallback
      - "7882:7882/udp"   # ICE/UDP
      - "3478:3478/udp"   # TURN/UDP
      - "3478:3478/tcp"   # TURN/TCP
      - "5349:5349/tcp"   # TURN/TLS
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
      - ./config/certs:/etc/livekit/certs:ro   # TURN certs (turn.crt / turn.key) when LIVEKIT_TURN_ENABLED=true
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_LOG_LEVEL: info
      # ─── TURN (self-hosted prod only) ───────────────────────
      # Off by default (no certs in dev). To enable, set these in your .env
      # and drop a CA-signed turn.crt/turn.key into ./config/certs. The
      # config-file block in config/livekit.yaml documents the same options.
      LIVEKIT_TURN_ENABLED: ${LIVEKIT_TURN_ENABLED:-false}
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}
      LIVEKIT_TURN_CERT_FILE: ${LIVEKIT_TURN_CERT_FILE:-/etc/livekit/certs/turn.crt}
      LIVEKIT_TURN_KEY_FILE: ${LIVEKIT_TURN_KEY_FILE:-/etc/livekit/certs/turn.key}
      LIVEKIT_TURN_TLS_PORT: ${LIVEKIT_TURN_TLS_PORT:-5349}
      LIVEKIT_TURN_UDP_PORT: ${LIVEKIT_TURN_UDP_PORT:-3478}
      LIVEKIT_TURN_TCP_PORT: ${LIVEKIT_TURN_TCP_PORT:-3478}
      # ─── LAN dev: advertised IP ────────────────────────────────
      # In Docker the container advertises its internal bridge IP (172.x/10.x)
      # in ICE candidates, which phones on the LAN can't reach — signaling
      # connects but video/audio never flows. Set this to the host's LAN IP
      # for dev, e.g. LIVEKIT_RTC_NODE_IP=192.168.1.50. Requires
      # use_external_ip: false (already set in livekit.yaml).
      LIVEKIT_RTC_NODE_IP: ${LIVEKIT_RTC_NODE_IP:-}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

  # ─── Core API Service ────────────────────────────────────
  api-core:
    build:
      context: .
      dockerfile: packages/api-core/Dockerfile
    container_name: kinetik-api-core
    restart: unless-stopped
    ports:
      - "${API_CORE_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinetik}:${POSTGRES_PASSWORD:-kinetik_dev_2024}@postgres:5432/${POSTGRES_DB:-kinetik}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kinetik_redis_2024}
      REDIS_EVENTS_HOST: redis-events
      REDIS_EVENTS_PORT: 6379
      REDIS_EVENTS_PASSWORD: ${REDIS_EVENTS_PASSWORD:-kinetik_events_2024}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-2024}
      JWT_EXPIRES_IN: 15m

      # RSA-2048 private key for decrypting auth credentials encrypted by the
      # mobile client. In production, set AUTH_RSA_PRIVATE_KEY in your .env file.
      AUTH_RSA_PRIVATE_KEY: ${AUTH_RSA_PRIVATE_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxxxxxxxxxxx}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-your_razorpay_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_ID: ${RAZORPAY_PLAN_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # Message encryption key (AES-256-GCM, any string)
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-kinetik_msg_enc_key_2024_dev}

      # LiveKit WebRTC (call tokens are issued by api-core)
      # LIVEKIT_PUBLIC_URL defaults to EMPTY so the token endpoint derives the
      # client-facing URL from the request host (the LAN IP / domain the device
      # actually used) instead of baking in `localhost`, which no physical
      # device can reach. Set it explicitly for LiveKit Cloud (wss://...).
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-kinetik_livekit_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-kinetik_livekit_secret_2024_dev_xyz}
      LIVEKIT_HOST: livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}

      # Geoapify reverse geocoding
      GEOAPIFY_API: ${GEOAPIFY_API:-}

      # MinIO S3-compatible object storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-kinetik-photos}
      MINIO_PUBLIC_URL: /uploads/
      # KYC document face matching only — selfie verification runs on-device
      # POSE_SERVICE_URL: http://pose-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

  # ─── Real-Time WebSocket Service ─────────────────────────
  realtime:
    build:
      context: .
      dockerfile: packages/realtime/Dockerfile
    container_name: kinetik-realtime
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinetik}:${POSTGRES_PASSWORD:-kinetik_dev_2024}@postgres:5432/${POSTGRES_DB:-kinetik}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kinetik_redis_2024}
      REDIS_EVENTS_HOST: redis-events
      REDIS_EVENTS_PORT: 6379
      REDIS_EVENTS_PASSWORD: ${REDIS_EVENTS_PASSWORD:-kinetik_events_2024}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-2024}
      LIVEKIT_HOST: livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-kinetik_livekit_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-kinetik_livekit_secret_2024_dev_xyz}
    depends_on:
      redis:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

  # ─── MinIO Object Storage (S3-compatible) ──────────────
  minio:
    image: minio/minio:latest
    container_name: kinetik-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging

  # ─── MinIO Bucket Setup (runs once on startup) ──────────
  minio-init:
    image: minio/mc:latest
    container_name: kinetik-minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - |
        set -e
        echo "Waiting for MinIO..."
        until mc alias set kinetik http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"; do
          echo "Retrying in 3s..."
          sleep 3
        done
        echo "Connected to MinIO"
        if mc ls kinetik/${MINIO_BUCKET:-kinetik-photos} > /dev/null 2>&1; then
          echo "Bucket already exists"
        else
          mc mb kinetik/${MINIO_BUCKET:-kinetik-photos}
          echo "Created bucket: ${MINIO_BUCKET:-kinetik-photos}"
        fi
        mc anonymous set download kinetik/${MINIO_BUCKET:-kinetik-photos}
        echo "Bucket policy set to public-read"
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  # ─── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kinetik-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-core
      - realtime
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 32M
    logging: *default-logging

  # ─── Pose / Face Service (Python / MediaPipe) ──────────────
  # DISABLED — selfie pose/liveness verification runs on-device in the
  # mobile app via TFLite.  Only uncomment this if you need server-side
  # KYC document face matching.
  # pose-service:
  #   build:
  #     context: packages/pose-service
  #     dockerfile: Dockerfile
  #   container_name: kinetik-pose-service
  #   restart: unless-stopped
  #   ports:
  #     - "${POSE_SERVICE_PORT:-3004}:3004"
  #   environment:
  #     ENVIRONMENT: ${ENVIRONMENT:-development}
  #     PORT: 3004
  #     HOST: "0.0.0.0"
  #     MINIO_ENDPOINT: minio:9000
  #     MINIO_BUCKET: ${MINIO_BUCKET:-kinetik-photos}
  #     MINIO_PUBLIC_URL: /uploads/
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 512M
  #       reservations:
  #         memory: 256M
  #   logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
