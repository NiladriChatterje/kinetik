  # ─── Database Migration Runner (one-shot) ────────────────
  # Applies all pending migration SQL files against the managed
  # Postgres named by POSTGRES_HOST on every stack start.
  # Idempotent — safe to run repeatedly.
  migration-runner:
    image: postgres:16-alpine
    container_name: kinetik-migration-runner
    restart: "no"
    environment:
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-kinetik}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kinetik_dev_2024}
      DB_NAME: ${POSTGRES_DB:-kinetik}
      # psql picks this up from the environment on every connection it opens.
      # `prefer` is psql's own default: it negotiates TLS when the server
      # offers it and falls back to plaintext for the local container, which
      # is built without SSL support. .env sets `require` for managed Postgres.
      PGSSLMODE: ${POSTGRES_SSLMODE:-prefer}
      MIGRATIONS_DIR: /app/scripts/migrations
    volumes:
      - ./scripts:/app/scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        exec /app/scripts/run-migrations.sh
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    logging: *default-logging

  # ─── Redis (Caching + Socket.IO adapter + presence) ─────
