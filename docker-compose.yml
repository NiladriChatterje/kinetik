  # ─── Core API Service ────────────────────────────────────
  api-core:
    build:
      context: .
      dockerfile: packages/api-core/Dockerfile
    container_name: kinetik-api-core
    restart: unless-stopped
    ports:
      - "${API_CORE_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      # Managed Postgres when .env sets DATABASE_URL; otherwise the local
      # `postgres` container. Comment the DB block out of .env, uncomment the
      # postgres service, and the whole stack falls back to local with no
      # further edits here.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kinetik}:${POSTGRES_PASSWORD:-kinetik_dev_2024}@postgres:5432/${POSTGRES_DB:-kinetik}}
      # In-network addresses of the sibling containers — deliberately NOT
      # ${REDIS_PORT}, which is the HOST-published port and differs from the
      # in-container one. Live config comes from the REDIS_*_URL vars below.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kinetik_redis_2024}
      REDIS_LAYERBASE_URL: ${REDIS_LAYERBASE_URL:-}
      REDIS_LAYERBASE_HOST: ${REDIS_LAYERBASE_HOST:-}
      REDIS_AIVEN_URL: ${REDIS_AIVEN_URL:-}
      REDIS_AIVEN_HOST: ${REDIS_AIVEN_HOST:-}
      REDIS_EVENTS_HOST: redis-events
      REDIS_EVENTS_PORT: 6379
      REDIS_EVENTS_PASSWORD: ${REDIS_EVENTS_PASSWORD:-kinetik_events_2024}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}

      # Google Play Billing. Google is the merchant of record; the server only
      # verifies purchase tokens against the Play Developer API.
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.kinetik.app}
      GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_ID: ${GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_ID:-kinetik_premium_monthly}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT_FILE: ${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_PLAY_RTDN_SECRET: ${GOOGLE_PLAY_RTDN_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # Email one-time codes via Brevo (free plan: 300/day, hard-stops at the
      # cap). Blank means codes are only logged and fixed to 123456.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Kinetik}
      # Set to "true" to skip Brevo entirely and only log OTPs.
      EMAIL_DISABLED: ${EMAIL_DISABLED:-}

      # Message encryption key (AES-256-GCM, any string)
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-kinetik_msg_enc_key_2024_dev}

      # Geoapify reverse geocoding
      GEOAPIFY_API: ${GEOAPIFY_API:-}

      # ─── Object storage (S3-compatible) ──────────────────
      # Defaults target the local `minio` container. Point every one of these
      # at Cloudflare R2 / AWS S3 from .env alone — no edit to this file:
      #   MINIO_ENDPOINT=<account>.r2.cloudflarestorage.com   (host only, no https://)
      #   MINIO_USE_SSL=true
      #   MINIO_REGION=auto
      #   MINIO_PUBLIC_URL=https://pub-<hash>.r2.dev/
      # ACCESS/SECRET fall back to the local container's root credentials, but
      # a remote bucket needs its own key pair — set them explicitly.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      MINIO_BUCKET: ${MINIO_BUCKET:-kinetik-photos}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/uploads/}

      # Expo push notifications (optional — unauthenticated sends work too)
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Set to "true" to skip Twilio entirely and only log OTPs. Blank keeps
      # today's behaviour: Twilio is used if its credentials are present.
      SMS_DISABLED: ${SMS_DISABLED:-}
      # KYC document face matching only — selfie verification runs on-device.
      # Deliberately left unset: the code reads `?? 'http://localhost:3004'`,
      # so UNSET means dev-localhost while an explicit EMPTY value means
      # "intentionally not deployed" and hides the action in the app. Adding
      # it here with a blank default would silently flip that.
      # POSE_SERVICE_URL: http://pose-service:3004
    depends_on:
      # postgres:
      #   condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

  # ─── Real-Time WebSocket Service ─────────────────────────
  realtime:
    build:
      context: .
      dockerfile: packages/realtime/Dockerfile
    container_name: kinetik-realtime
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      # See api-core: managed Postgres via .env, local container otherwise.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kinetik}:${POSTGRES_PASSWORD:-kinetik_dev_2024}@postgres:5432/${POSTGRES_DB:-kinetik}}
      # In-network addresses of the sibling containers — deliberately NOT
      # ${REDIS_PORT}, which is the HOST-published port and differs from the
      # in-container one. Live config comes from the REDIS_*_URL vars below.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kinetik_redis_2024}
      REDIS_LAYERBASE_URL: ${REDIS_LAYERBASE_URL:-}
      REDIS_LAYERBASE_HOST: ${REDIS_LAYERBASE_HOST:-}
      REDIS_AIVEN_URL: ${REDIS_AIVEN_URL:-}
      REDIS_AIVEN_HOST: ${REDIS_AIVEN_HOST:-}
      REDIS_EVENTS_HOST: redis-events
      REDIS_EVENTS_PORT: 6379
      REDIS_EVENTS_PASSWORD: ${REDIS_EVENTS_PASSWORD:-kinetik_events_2024}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-2024}
    depends_on:
      # redis:
      #   condition: service_healthy
      # redis-events:
      #   condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 128M
    logging: *default-logging

  # ─── MinIO Object Storage (S3-compatible) ──────────────
  minio:
    # minio/minio and minio/mc were removed from Docker Hub in 2026 and MinIO's
    # own registry (quay.io) now needs a login. Chainguard publishes a public
    # build of the same server binary; the image is distroless apart from bash.
    image: chainguard/minio:latest
    container_name: kinetik-minio
    restart: unless-stopped
    # The image runs as uid 65532, but a fresh named volume is created owned
    # by root, so the server cannot initialise /data ("file access denied").
    # The upstream image ran as root too, so nothing changes security-wise.
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      # No curl or wget in the image; bash's /dev/tcp does the HTTP probe.
      # HTTP/1.1 with a Host header is required — MinIO answers 400 otherwise.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r line <&3 && [[ "$$line" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging

  # ─── MinIO Bucket Setup (runs once on startup) ──────────
  minio-init:
    # minio/mc is gone from Docker Hub as well. Bitnami's frozen legacy build
    # ships the same mc binary on PATH and a /bin/sh for the script below.
    image: bitnamilegacy/minio-client:latest
    container_name: kinetik-minio-init
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - |
        set -e
        echo "Waiting for MinIO..."
        until mc alias set kinetik http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"; do
          echo "Retrying in 3s..."
          sleep 3
        done
        echo "Connected to MinIO"
        if mc ls kinetik/${MINIO_BUCKET:-kinetik-photos} > /dev/null 2>&1; then
          echo "Bucket already exists"
        else
          mc mb kinetik/${MINIO_BUCKET:-kinetik-photos}
          echo "Created bucket: ${MINIO_BUCKET:-kinetik-photos}"
        fi
        mc anonymous set download kinetik/${MINIO_BUCKET:-kinetik-photos}
        echo "Bucket policy set to public-read"
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  # ─── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kinetik-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-core
      - realtime
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 32M
    logging: *default-logging
  # ─── Pose / Face Service (Python / MediaPipe) ──────────────
  # DISABLED — selfie face verification runs on-device in the
  # mobile app via TFLite.  Only uncomment this if you need server-side
  # KYC document face matching.
  # pose-service:
  #   build:
  #     context: packages/pose-service
  #     dockerfile: Dockerfile
  #   container_name: kinetik-pose-service
  #   restart: unless-stopped
  #   ports:
  #     - "${POSE_SERVICE_PORT:-3004}:3004"
  #   environment:
  #     ENVIRONMENT: ${ENVIRONMENT:-development}
  #     PORT: 3004
  #     HOST: "0.0.0.0"
  #     MINIO_ENDPOINT: minio:9000
  #     MINIO_BUCKET: ${MINIO_BUCKET:-kinetik-photos}
  #     MINIO_PUBLIC_URL: /uploads/
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 512M
  #       reservations:
  #         memory: 256M
  #   logging: *default-logging

volumes:
  postgres-data: # redis-data:

  minio-data:
